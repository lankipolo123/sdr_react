appId: com.sdr.react
productName: SDR React
directories:
  buildResources: build
# koffi and serialport both ship prebuilt N-API bindings for every
# platform already (see the serialport comment under files: below) -
# there's nothing to compile. electron-builder's default npmRebuild
# tries to rebuild native deps from source for the target arch anyway,
# which node-gyp can't do cross-platform (this build runs on Linux,
# targeting win/x64) and would be wasted work even building natively.
npmRebuild: false
# build/icon.ico (multi-size, 16-256px) is picked up automatically for
# the win/nsis target from directories.buildResources above - no
# explicit win.icon needed.
files:
  - out/**/*
  - node_modules/koffi/**/*
  # serialport (the amplifier temperature sensor's raw Modbus RTU
  # connection - see src/main/serial/) ships prebuilt native bindings
  # for every platform inside the one package, N-API-based so the same
  # binary works in both plain Node and Electron with no rebuild step.
  # `files` defaults to an explicit allowlist in this config (see the
  # koffi entry above), so these need listing too or the packaged app
  # would be missing the module entirely.
  - node_modules/serialport/**/*
  - node_modules/@serialport/**/*
# Transit_x64.dll ships alongside the app, not bundled into the ASAR -
# koffi.load() needs a real filesystem path, not an ASAR-packed one.
# resolveDllPath() in src/main/dll/transit.ts reads it from
# process.resourcesPath/dll/ in a packaged build - this extraResources
# entry is what actually puts it there.
extraResources:
  - from: dll
    to: dll
  # Default app icon (window/taskbar icon at runtime - see
  # resolveIconPath() in src/main/index.ts). Separate from build/icon.ico
  # above, which only covers the packaged .exe's own file icon and the
  # installer/uninstaller icon - Windows doesn't derive a running
  # window's icon from the exe's file icon automatically.
  - from: resources
    to: resources
win:
  target:
    - target: nsis
      # Explicit x64 - this app is built around the 64-bit Transit.dll
      # specifically (see src/main/dll/transit.ts), not the 32-bit one
      # the original rewrite guide defaulted to.
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
